name: Build iOS App

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Select Xcode 27.0
        run: |
          XCODE=/Applications/Xcode_27.0.app/Contents/Developer
          if [ ! -d "$XCODE" ]; then
            echo "Xcode 27.0 is not installed on this runner."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE"
          xcodebuild -version

      - name: Restore All Workloads Automatically
        run: dotnet workload restore MauiApp1/MauiApp1/MauiApp1.csproj

      - name: Restore Project Dependencies
        run: dotnet restore MauiApp1/MauiApp1/MauiApp1.csproj -p:TargetFramework=net10.0-ios -p:TargetFrameworks=net10.0-ios

      - name: Build iOS App (Unsigned)
        run: |
          dotnet publish MauiApp1/MauiApp1/MauiApp1.csproj \
            -f net10.0-ios \
            -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:ArchiveOnBuild=true \
            -p:EnableCodeSigning=false

      - name: Upload iOS Build Output
        uses: actions/upload-artifact@v4
        with:
          name: MauiApp1-iOS-Build
          path: "MauiApp1/MauiApp1/bin/Release/net10.0-ios/**"
