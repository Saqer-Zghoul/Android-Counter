name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore MauiApp1/MauiApp1/MauiApp1.csproj -p:TargetFramework=net8.0-android

      - name: Build APK
        run: dotnet publish MauiApp1/MauiApp1/MauiApp1.csproj -f net8.0-android -c Release -p:AndroidPackageFormat=apk -p:CheckEolTargetFramework=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MauiApp1-APK
          path: "MauiApp1/MauiApp1/bin/Release/net8.0-android/*-Signed.apk"
