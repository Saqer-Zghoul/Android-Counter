name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore MauiApp1/MauiApp1/MauiApp1.csproj -p:TargetFramework=net10.0-android

      - name: Build APK
        run: dotnet publish MauiApp1/MauiApp1/MauiApp1.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MauiApp1-APK
          path: "MauiApp1/MauiApp1/bin/Release/net10.0-android/*.apk"
